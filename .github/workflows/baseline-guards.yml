name: Baseline Guard Regression

on:
  push:
    branches:
      - main
    paths:
      - apps/security-lab/test/baseline*.mjs
      - apps/security-lab/test/resource-process.mjs
      - apps/security-lab/test/resource-config.mjs
      - package.json
      - package-lock.json
      - .github/workflows/baseline-guards.yml
  pull_request:
    paths:
      - apps/security-lab/test/baseline*.mjs
      - apps/security-lab/test/resource-process.mjs
      - apps/security-lab/test/resource-config.mjs
      - package.json
      - package-lock.json
      - .github/workflows/baseline-guards.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseline-guards-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: Baseline admission guard tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run baseline admission guard tests
        run: node apps/security-lab/test/baseline.test.mjs
