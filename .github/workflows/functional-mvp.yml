name: Functional Worksheet MVP

on:
  push:
    branches: [main]
    paths:
      - 'apps/worksheet/**'
      - 'apps/security-lab/src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/functional-mvp.yml'
      - '!apps/worksheet/**/*.md'
  pull_request:
    paths:
      - 'apps/worksheet/**'
      - 'apps/security-lab/src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/functional-mvp.yml'
      - '!apps/worksheet/**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: functional-mvp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fullflow:
    name: Full functional flow (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      BROWSER_ENGINE: ${{ matrix.browser }}
      FUNCTIONAL_EVENT: ${{ github.event_name }}
      FUNCTIONAL_EVENT_SHA: ${{ github.sha }}
      NPM_CONFIG_FETCH_RETRIES: 0
      NPM_CONFIG_FETCH_TIMEOUT: 10000
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Record source and lock evidence
        run: node apps/worksheet/test/functional-ci.mjs source
      - name: Check the new CI completeness oracle once
        if: matrix.browser == 'chromium'
        run: node apps/worksheet/test/functional-ci.test.mjs
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts
      - name: Build the app shell and trusted runner
        run: npm run build:app
      - name: Install selected Playwright browser and system dependencies
        run: npx --no-install playwright install --with-deps ${{ matrix.browser }}
      - name: Provide PDF text extraction
        run: command -v pdftotext >/dev/null || sudo apt-get install --yes --no-install-recommends -o Acquire::Retries=0 poppler-utils
      - name: Bind Chromium to the package-managed executable
        if: matrix.browser == 'chromium'
        run: node apps/worksheet/test/functional-ci.mjs chromium-path
      - name: Run only the complete new functional flow
        timeout-minutes: 6
        env:
          DEBUG: pw:browser
        run: npm run test:app > apps/worksheet/test-results/functional-run.log 2>&1
      - name: Verify version and complete flow evidence
        if: always()
        run: node apps/worksheet/test/functional-ci.mjs verify
      - name: Upload reports PDF files logs and actual app screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: functional-mvp-${{ matrix.browser }}
          path: apps/worksheet/test-results/
          if-no-files-found: error
          retention-days: 7
