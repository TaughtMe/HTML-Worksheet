name: Security Lab

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "apps/security-lab/test/baseline*.mjs"
      - "apps/security-lab/test/tab-recovery*.mjs"
      - ".github/workflows/tab-recovery.yml"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "apps/security-lab/test/baseline*.mjs"
      - "apps/security-lab/test/tab-recovery*.mjs"
      - ".github/workflows/tab-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, unit tests, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Build
        run: npm run build

  browser:
    needs: checks
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build browser test bundle
        run: npm run build
      - name: Install ${{ matrix.browser }} and system dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run browser tests
        run: npm run test:browser
        env:
          BROWSER_ENGINE: ${{ matrix.browser }}
      - name: Upload browser report and receiver logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-lab-${{ matrix.browser }}
          path: apps/security-lab/test-results/
          if-no-files-found: warn
          retention-days: 7
