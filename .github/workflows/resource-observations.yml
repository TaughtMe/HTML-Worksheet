name: Resource Observations

on:
  push:
    branches:
      - main
    paths:
      - apps/security-lab/**
      - package.json
      - package-lock.json
      - .github/workflows/resource-observations.yml
      - '!apps/security-lab/test/baseline*.mjs'
      - '!apps/security-lab/test/tab-recovery*.mjs'
      - '!.github/workflows/tab-recovery.yml'
  pull_request:
    paths:
      - apps/security-lab/**
      - package.json
      - package-lock.json
      - .github/workflows/resource-observations.yml
      - '!apps/security-lab/test/baseline*.mjs'
      - '!apps/security-lab/test/tab-recovery*.mjs'
      - '!.github/workflows/tab-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resource-observations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resources:
    name: Resource observations (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build test bundle
        run: npm run build
      - name: Run resource controller regression tests
        run: node apps/security-lab/test/resource-control.test.mjs
      - name: Install ${{ matrix.browser }} and system dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run resource observations
        run: npm run test:resources
        env:
          BROWSER_ENGINE: ${{ matrix.browser }}
      - name: Upload resource observation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resource-observations-${{ matrix.browser }}
          path: apps/security-lab/test-results/resources-*.json
          if-no-files-found: warn
          retention-days: 7
